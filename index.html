<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Orb Assistant</title>
<style>
:root{--bg:#0a0c14;--surf:#151927;--surf2:#1f2538;--line:#2a3045;--fg:#eef1fa;--dim:#8d96ad;--accent:#4f8cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c14}}
:root[data-theme="dark"]{--bg:#0a0c14}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--fg)}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.blob,#floor{display:none}
.abs{position:absolute;left:50%;top:50%;border-radius:50%;will-change:transform,opacity}
#halo{background:radial-gradient(circle,rgba(90,150,255,.30),rgba(90,150,255,.08) 45%,rgba(0,0,0,0) 70%)}
#orb{background:transparent;border:0;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none}
#spacer{flex:none;display:flex;align-items:flex-end;justify-content:center}
#chat,#dock{pointer-events:auto}
#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:min(640px,calc(100% - 24px));margin:0 auto;padding:14px 4px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;-webkit-mask-image:linear-gradient(transparent,#000 22px);mask-image:linear-gradient(transparent,#000 22px)}
.msg{max-width:88%;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--surf2);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 4px 18px}
.msg.user.live{opacity:.65}
.msg.assistant{align-self:flex-start;padding:2px 4px}
.msg.typing{color:var(--dim)}
.msg.err{color:#ff9aa8}
#dock{flex:none;width:min(640px,calc(100% - 24px));margin:0 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#state{font-size:13px;letter-spacing:.05em;color:var(--dim);padding-bottom:2px}
#caption{min-height:18px;font-size:13px;line-height:1.35;color:var(--dim);text-align:center;margin:2px 0 8px}
.glass{background:var(--surf);border:1px solid var(--line)}
#bar{display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px}
#txt{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font-size:16px;padding:8px 6px 8px 14px}
#txt::placeholder{color:var(--dim)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surf2);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:background .25s}
.btn:hover{background:#2a3250}
.btn:focus-visible,#orb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:var(--accent);border-color:var(--accent)}
#gear{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
#gear svg{width:22px;height:22px}
#panel{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:14px;width:min(340px,calc(100% - 28px));box-sizing:border-box;padding:16px;border-radius:18px;text-align:left;max-height:calc(100% - 110px);overflow:auto}
#panel label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.fld{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:10px 12px;font-size:16px;outline:0}
.fld option{color:#111}
.row{display:flex;gap:8px;margin-top:16px}
.pill{flex:1;border-radius:999px;padding:10px 6px;border:1px solid var(--line);background:var(--surf2);color:var(--fg);font-size:14px;cursor:pointer}
#save{background:var(--accent);border-color:var(--accent)}
.pill:focus-visible,.fld:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--dim);line-height:1.4;margin:12px 0 0}
</style>
</head>
<body>
<div id="stage">
 <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
 <div id="floor" class="abs"></div><div id="halo" class="abs"></div>
 <div id="orb" class="abs" role="button" tabindex="0" aria-label="Talk to assistant"></div>
 <canvas id="c"></canvas>
</div>
<div id="app">
 <div id="spacer"><div id="state" aria-live="polite">Ready</div></div>
 <div id="chat" aria-live="polite"></div>
 <div id="dock">
  <p id="caption"></p>
  <div id="bar" class="glass">
  <input id="txt" type="text" placeholder="Ask me anything" aria-label="Message" autocomplete="off">
  <button id="send" class="btn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button id="mic" class="btn" aria-label="Start listening"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
 </div>
</div>
</div>
<button id="gear" class="btn glass" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div id="panel" class="glass" hidden>
 <label for="lang">Voice language</label>
 <select id="lang" class="fld"><option value="">Browser default</option><option value="en-US">English</option><option value="ur-PK">اردو (Urdu)</option><option value="hi-IN">हिन्दी (Hindi)</option></select>
 <label for="voice">Voice</label><select id="voice" class="fld"><option value="">Automatic</option></select>
 <label for="pitch">Pitch (lower is deeper)</label><input id="pitch" class="fld" type="range" min="0.6" max="1.3" step="0.05" value="1" style="padding:0;border:0">
 <label for="rate">Speed</label><input id="rate" class="fld" type="range" min="0.7" max="1.3" step="0.05" value="1.02" style="padding:0;border:0">
 <button id="jarvis" class="pill" style="width:100%;margin-top:12px">Try Jarvis style voice</button>
 <label for="base">API base URL</label><input id="base" class="fld" type="url" autocomplete="off" spellcheck="false">
 <label for="model">Model</label><input id="model" class="fld" list="models" autocomplete="off" spellcheck="false"><datalist id="models"></datalist>
 <label for="key">API key</label><input id="key" class="fld" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_...">
 <p class="note">Default is Groq. Any OpenAI-compatible service works (for Grok use https://api.x.ai/v1). Your key is saved only in this browser.</p>
 <div class="row"><button id="save" class="pill">Save</button><button id="load" class="pill">Load models</button><button id="clear" class="pill">Clear key</button></div>
 <button id="newchat" class="pill" style="width:100%;margin-top:10px">New chat</button>
 <p id="cstat" class="note" aria-live="polite"></p>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('c'),ctx=cv.getContext('2d'),orb=$('orb'),halo=$('halo'),floor=$('floor'),W,H,dpr,R0,CY;
function place(el,w,h,dy){el.style.width=w+'px';el.style.height=h+'px';el.style.marginLeft=-w/2+'px';el.style.marginTop=(-h/2+dy)+'px'}
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 R0=Math.min(W*.2,H*.11);var topH=Math.round(R0*3.3);CY=topH*.47;$('spacer').style.height=topH+'px';var dy=CY-H/2;
 place(orb,R0*2.5,R0*2.5,dy);place(halo,R0*5,R0*5,dy);place(floor,R0*2.6,R0*.5,dy+R0*1.55)}
size();addEventListener('resize',size);

/* ---------- Assistant state + public API ---------- */
var state='idle',S={listen:0,think:0,speak:0},ext=0,extT=-1e9,lvl=0,bump=0,micLevel=0,stream,ac,an,data,rec,thinkT,aborter,spk=0,hist=[];
var INSTR='You are a warm, concise personal voice assistant. Reply in the language the user spoke, including Urdu or Roman Urdu. Keep answers to one to three short spoken sentences. No markdown, lists, or emojis.';
var LABEL={idle:'Ready',listening:'Listening',thinking:'Thinking',speaking:'Speaking'};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,LANG=navigator.language||'en-US';
function setState(s){state=s;$('state').textContent=LABEL[s];$('mic').classList.toggle('on',s==='listening');$('mic').setAttribute('aria-label',s==='listening'?'Stop listening':'Start listening')}
function setCaption(t){$('caption').textContent=t}
window.OrbAssistant={setState:setState,setCaption:setCaption,ask:function(t){ask(t)},setLevel:function(v){ext=Math.max(0,Math.min(1,v));extT=performance.now()},
 onSend:null /* set to function(text){...} to connect your own assistant instead of the built-in replies */};

var uname='',JOKES=['Why did the computer go to the doctor? It caught a virus.','Why do programmers prefer dark mode? Because light attracts bugs.','I told my computer I needed a break, and it froze.','Why was the math book sad? It had too many problems.','What do you call a fake noodle? An impasta.'];
function brain(raw){
 var t=raw.toLowerCase().replace(/[?.!,]/g,'').trim(),m;
 if(m=t.match(/^(?:say|repeat after me|repeat)\s+(.+)/))return m[1];
 if(m=t.match(/my name is ([a-z\u0600-\u06ff ]+)/)){uname=m[1].trim();return 'Nice to meet you, '+uname+'.'}
 if(/what.?s my name|what is my name|do you know my name/.test(t))return uname?'Your name is '+uname+'.':'You haven’t told me your name yet.';
 if(m=t.match(/(-?\d+(?:\.\d+)?)\s*(plus|\+|minus|-|times|multiplied by|x|\*|divided by|over|\/)\s*(-?\d+(?:\.\d+)?)/)){
  var a=+m[1],b=+m[3],o=m[2],r;
  if(o==='plus'||o==='+')r=a+b;else if(o==='minus'||o==='-')r=a-b;else if(/divided|over|\//.test(o)){if(b===0)return 'I can’t divide by zero.';r=a/b}else r=a*b;
  return 'The answer is '+Math.round(r*1e6)/1e6+'.'}
 if(/\b(thank|thanks|shukriya)\b/.test(t))return 'You’re welcome!';
 if(/\b(bye|goodbye|see you)\b/.test(t))return 'Goodbye! Talk to you soon.';
 if(/how are you|how do you do|how.?s it going/.test(t))return 'I’m doing great, thanks for asking. How are you?';
 if(/your name|who are you|what are you/.test(t))return 'I’m your personal voice assistant.';
 if(/what time|the time|time is it/.test(t))return 'It’s '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.';
 if(/what.?s the date|today.?s date|what day|the date|which day/.test(t))return 'Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'.';
 if(/joke|make me laugh/.test(t))return JOKES[Math.floor(Math.random()*JOKES.length)];
 if(/flip a coin|toss a coin|coin flip/.test(t))return Math.random()<.5?'It’s heads.':'It’s tails.';
 if(/roll a (die|dice)|roll the dice/.test(t))return 'You rolled a '+(1+Math.floor(Math.random()*6))+'.';
 if(/\b(help|what can you do)\b/.test(t))return 'I can tell the time and date, do simple maths, tell jokes, flip a coin, roll a dice, remember your name, or repeat what you say.';
 if(/\b(hi|hello|hey|salam|assalam)\b/.test(t))return 'Hello'+(uname?', '+uname:'')+'! How can I help you?';
 return 'I heard “'+raw.trim()+'”, but I don’t know how to answer that yet. Say help to hear what I can do.';
}
var chat=$('chat'),liveEl=null,cur=null;
function scrollEnd(){chat.scrollTop=chat.scrollHeight}
function addMsg(role,text){var d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);scrollEnd();return d}
function dropLive(){if(liveEl){liveEl.remove();liveEl=null}}
function greet(){addMsg('assistant','Hi! Tap the orb and speak, or type below.')}
function show(t,el){el=el||cur;if(!el)return;el.classList.remove('typing');el.textContent=t;scrollEnd()}
function fail(m,el){el=el||cur;setState('idle');if(el&&el.classList.contains('typing')){show(m,el);el.classList.add('err')}else setCaption(m)}
window.OrbAssistant.reply=function(t){show(t);speak(t)};
var pend=0,streamDone=false;
function say(t,id){
 if(!('speechSynthesis' in window))return;
 var u=mkUtt(t);pend++;
 u.onboundary=function(){bump=1};
 u.onend=u.onerror=function(){if(id!==spk)return;pend--;if(pend<=0&&streamDone&&state==='speaking')setState('idle')};
 speechSynthesis.speak(u);
}
async function ask(text){
 stopListen();stopSpeak();clearTimeout(thinkT);if(aborter)aborter.abort();setCaption('');setState('thinking');
 if(liveEl){liveEl.textContent=text;liveEl.classList.remove('live');liveEl=null}else addMsg('user',text);
 var el=cur=addMsg('assistant','…');el.classList.add('typing');
 if(window.OrbAssistant.onSend){window.OrbAssistant.onSend(text);return}
 if(!cfg.key){thinkT=setTimeout(function(){var r=brain(text);show(r,el);speak(r)},700);return}
 aborter=new AbortController();
 var id=spk,full='',sb='',started=false;pend=0;streamDone=false;
 function piece(s){if(!started){started=true;setState('speaking')}say(s,id)}
 function flush(last){var m;while(m=sb.match(/^[\s\S]*?(?:[.!?۔؟](?=\s|$)|\n)/)){var s=m[0].trim();sb=sb.slice(m[0].length);if(s)piece(s)}if(last&&sb.trim()){piece(sb.trim());sb=''}}
 var msgs=[{role:'system',content:INSTR}].concat(hist.slice(-10),[{role:'user',content:text}]);
 try{
  var res=await fetch(cfg.base.replace(/\/+$/,'')+'/chat/completions',{method:'POST',signal:aborter.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
   body:JSON.stringify({model:cfg.model,messages:msgs,max_tokens:400,temperature:.7,stream:true})});
  if(!res.ok){var st=res.status,em='';try{var ej=await res.json();em=String((ej.error&&ej.error.message)||ej.error||'').slice(0,180)}catch(e){}
   return fail((st===401||st===403?'The API key was rejected. Check it in settings.':st===404?'Model not found. Check the model name in settings.':st===429?'Rate limit reached or no credit left. Check your provider account.':'The API returned an error ('+st+').')+(em?' '+em:''),el)}
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  while(true){
   var ch=await rd.read();if(ch.done)break;
   buf+=dec.decode(ch.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
   for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();if(ln.indexOf('data:')!==0)continue;var d=ln.slice(5).trim();if(d==='[DONE]')continue;
    try{var c=JSON.parse(d).choices[0].delta.content;if(c){full+=c;sb+=c;show(full.trim(),el);flush(false)}}catch(e){}
   }
  }
  full=full.trim();
  if(!full)return fail('I got an empty reply. Try again.',el);
  flush(true);streamDone=true;hist.push({role:'user',content:text},{role:'assistant',content:full});
  if(!started||pend<=0)setState('idle');
 }catch(e){if(e&&e.name==='AbortError')return;fail('I couldn’t reach the API. Check your internet, key and base URL. Some providers block browser requests.',el)}
}
function speak(t){
 if(!('speechSynthesis' in window)||!t){setState('idle');return}
 var id=++spk,u=mkUtt(t);
 u.onboundary=function(){bump=1};
 u.onend=u.onerror=function(){if(id===spk&&state==='speaking')setState('idle')};
 speechSynthesis.cancel();speechSynthesis.speak(u);setState('speaking');
}
function stopSpeak(){spk++;if('speechSynthesis' in window)speechSynthesis.cancel()}
async function openMeter(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;
 ac.createMediaStreamSource(stream).connect(an);data=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}
function closeMeter(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(ac){try{ac.close()}catch(e){}ac=null}an=null;micLevel=0}
function stopListen(){if(rec){rec.onend=null;rec.onerror=null;try{rec.abort()}catch(e){}rec=null}closeMeter()}
function startListen(){
 try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
 if(!SR){setCaption('Voice input isn’t supported in this browser. Type your question instead.');return}
 var finalT='';rec=new SR();rec.lang=LANG;rec.interimResults=true;rec.continuous=false;
 rec.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)finalT+=r[0].transcript;else interim+=r[0].transcript}var tx=(finalT+interim).trim();if(tx){if(!liveEl){liveEl=addMsg('user','');liveEl.classList.add('live')}liveEl.textContent=tx;scrollEnd()}};
 rec.onerror=function(e){var blocked='Microphone access is blocked. Allow it for this page, or type instead.',m={'not-allowed':blocked,'service-not-allowed':blocked,'no-speech':'I didn’t hear anything. Tap and try again.','network':'Speech recognition needs an internet connection.'};
  dropLive();stopListen();setState('idle');setCaption(m[e.error]||'I couldn’t hear you. Try again.')};
 rec.onend=function(){var t=finalT.trim();if(state!=='listening')return;if(t)ask(t);else{dropLive();stopListen();setState('idle');setCaption('I didn’t catch that. Tap and try again.')}};
 setState('listening');setCaption('Listening…');
 try{rec.start()}catch(e){}
 openMeter();
}
function toggle(){
 if(state==='listening'){try{rec.stop()}catch(e){}return}
 if(state==='thinking'||state==='speaking'){clearTimeout(thinkT);if(aborter)aborter.abort();stopSpeak();setState('idle');setCaption('Stopped. Tap to talk again.');return}
 startListen();
}
$('mic').onclick=toggle;orb.onclick=toggle;
orb.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};
function send(){var v=$('txt').value.trim();if(v){$('txt').value='';ask(v)}}
$('send').onclick=send;$('txt').onkeydown=function(e){if(e.key==='Enter')send()};

/* ---------- Settings (saved only in this browser) ---------- */
var DEF={base:'https://api.groq.com/openai/v1',model:'openai/gpt-oss-120b',key:'',lang:'',voice:'',pitch:1,rate:1.02},cfg=Object.assign({},DEF);
try{Object.assign(cfg,JSON.parse(localStorage.getItem('orb.cfg')||'{}'))}catch(e){}
LANG=cfg.lang||navigator.language||'en-US';
function saveCfg(){try{localStorage.setItem('orb.cfg',JSON.stringify(cfg))}catch(e){}}
function fillForm(){$('base').value=cfg.base;$('model').value=cfg.model;$('key').value=cfg.key;$('lang').value=cfg.lang;$('voice').value=cfg.voice||'';$('pitch').value=cfg.pitch||1;$('rate').value=cfg.rate||1.02;$('cstat').textContent='Version 7'}
$('gear').onclick=function(){$('panel').hidden=!$('panel').hidden;if(!$('panel').hidden)fillForm()};
$('save').onclick=function(){cfg.base=$('base').value.trim()||DEF.base;cfg.model=$('model').value.trim()||DEF.model;cfg.key=$('key').value.trim();cfg.lang=$('lang').value;cfg.voice=$('voice').value;cfg.pitch=+$('pitch').value;cfg.rate=+$('rate').value;
 LANG=cfg.lang||navigator.language||'en-US';saveCfg();$('panel').hidden=true;setCaption(cfg.key?'Saved. Tap the orb and talk to me.':'No key set, so I’ll use simple built-in replies.')};
$('clear').onclick=function(){cfg.key='';$('key').value='';saveCfg();$('cstat').textContent='Key removed from this browser.'};
$('load').onclick=async function(){
 var k=$('key').value.trim(),b=($('base').value.trim()||DEF.base).replace(/\/+$/,'');
 if(!k){$('cstat').textContent='Enter your key first.';return}
 $('cstat').textContent='Loading…';
 try{var r=await fetch(b+'/models',{headers:{Authorization:'Bearer '+k}});if(!r.ok){$('cstat').textContent=(r.status===401||r.status===403)?'The key was rejected (error '+r.status+'). Check the key.':'The server answered with error '+r.status+'.';return}var j=await r.json(),dl=$('models');dl.innerHTML='';
  (j.data||[]).forEach(function(m){if(m.id){var o=document.createElement('option');o.value=m.id;dl.appendChild(o)}});
  $('cstat').textContent=dl.children.length+' models found. Tap the Model box to pick one.'}
 catch(e){$('cstat').textContent='Couldn’t reach the server. Either there’s no internet, or this provider blocks requests made from a browser.'}
};
function mkUtt(t){var u=new SpeechSynthesisUtterance(t);u.lang=LANG;u.rate=cfg.rate||1.02;u.pitch=cfg.pitch||1;
 if(cfg.voice){var v=speechSynthesis.getVoices().find(function(x){return x.name===cfg.voice});if(v){u.voice=v;u.lang=v.lang}}return u}
function loadVoices(){if(!('speechSynthesis' in window))return;var sel=$('voice'),vs=speechSynthesis.getVoices();sel.innerHTML='<option value="">Automatic</option>';
 vs.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});sel.value=cfg.voice||''}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
$('jarvis').onclick=function(){
 if(!('speechSynthesis' in window))return;
 var vs=speechSynthesis.getVoices(),gb=vs.filter(function(v){return /en[-_]GB/i.test(v.lang)}),
  pick=gb.find(function(v){return /male|daniel|george|ryan|arthur|oliver|thomas/i.test(v.name)&&!/female/i.test(v.name)})||gb[0]||vs.find(function(v){return /^en/i.test(v.lang)&&/male/i.test(v.name)&&!/female/i.test(v.name)});
 if(pick){cfg.voice=pick.name;$('voice').value=pick.name}
 cfg.pitch=.85;cfg.rate=.95;$('pitch').value=.85;$('rate').value=.95;saveCfg();
 stopSpeak();speechSynthesis.speak(mkUtt('Good evening. All systems are online. How may I assist you?'));
 $('cstat').textContent=pick?'Voice set to '+pick.name+'.':'No British male voice found on this device. Pick one from the Voice list.';
};
if(!cfg.key)setCaption('Tap the gear and add your API key. Until then I use simple built-in replies.');
globalThis.hist=hist;greet();
$('newchat').onclick=function(){chat.innerHTML='';hist.length=0;liveEl=null;cur=null;$('panel').hidden=true;greet()};

/* ---------- Particle orb ---------- */
var SP=[];for(var h=0;h<12;h++){var c=document.createElement('canvas');c.width=c.height=48;var g=c.getContext('2d');
 var gr=g.createRadialGradient(24,24,0,24,24,24);gr.addColorStop(0,'hsla('+h*30+',100%,92%,1)');gr.addColorStop(.25,'hsla('+h*30+',100%,72%,.55)');gr.addColorStop(1,'hsla('+h*30+',100%,60%,0)');
 g.fillStyle=gr;g.fillRect(0,0,48,48);SP.push(c)}
var N=1700,P=[],ga=Math.PI*(3-Math.sqrt(5));
for(var i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),t=ga*i,core=i%5===0?Math.random()*.55+.2:1;
 P.push({x:Math.cos(t)*r*core,y:y*core,z:Math.sin(t)*r*core,ph:Math.random()*6.28,s:Math.random()*.9+.7,core:core<1})}
var spin=0,last=performance.now(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function appr(cur,tg,dt,k){return cur+(tg-cur)*(1-Math.exp(-dt*k))}
function frame(now){
 var dt=Math.min((now-last)/1000,.05);last=now;
 S.listen=appr(S.listen,state==='listening'?1:0,dt,3.2);S.think=appr(S.think,state==='thinking'?1:0,dt,3);S.speak=appr(S.speak,state==='speaking'?1:0,dt,3.2);
 bump=Math.max(0,bump-dt*3.5);var act=S.listen+S.speak,raw=0;
 if(an&&state==='listening'){an.getByteFrequencyData(data);var sum=0;for(var j=0;j<data.length;j++)sum+=data[j];micLevel=Math.min(1,sum/data.length/255*3.2);raw=micLevel}
 else if(state==='listening')raw=.3+.22*Math.sin(now/260)*Math.sin(now/610);
 else if(state==='speaking')raw=Math.min(1,.3+.2*Math.sin(now/130)*Math.sin(now/340)+.5*bump);
 if(now-extT<250)raw=ext;
 lvl=appr(lvl,raw,dt,12);
 spin+=dt*(reduce?.08:Math.max(.12,.5+1.1*S.think-.34*S.listen-.2*S.speak));
 var s=(1+.12*S.listen+.08*S.speak+.1*lvl*act-.06*S.think)*(1+.012*Math.sin(now/1300)),R=R0*s,cx=W/2;
 orb.style.transform='scale('+s+')';
 halo.style.transform='scale('+(.9+.25*act+.15*lvl)+')';halo.style.opacity=Math.min(1,.35+.4*act+.3*lvl+.15*S.think);
 floor.style.transform='scale('+(1+.12*act)+')';
 ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
 var tl=.38+.05*Math.sin(now/2600),cs=Math.cos(spin),sn=Math.sin(spin),ct=Math.cos(tl),st=Math.sin(tl),hue0=now/60+S.think*70;
 for(var i=0;i<N;i++){
  var p=P[i],x=p.x*cs+p.z*sn,z=-p.x*sn+p.z*cs,y2=p.y*ct-z*st,z2=p.y*st+z*ct;
  var wave=1+(.02+.05*lvl)*act*Math.sin(p.y*3.2-now/420)+.01*Math.sin(p.ph+now/1100);
  var k=R*wave*(1+z2*.1),depth=(z2+1)/2;
  var a=(.2+.8*depth)*(p.core?.55:1)*(.75+.25*act),rad=p.s*(1.1+depth*1.1)*(1+.3*act+.2*lvl)*3;
  var hb=Math.floor((((190+hue0+y2*70+depth*60)%360)+360)%360/30)%12;
  ctx.globalAlpha=Math.min(a,1);ctx.drawImage(SP[hb],cx+x*k-rad,CY+y2*k-rad,rad*2,rad*2);
 }
 ctx.globalCompositeOperation='source-over';
 if(act>.05){ctx.globalAlpha=Math.min(.5,(.12+.45*lvl)*act);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,CY,R0*(1.3+.25*lvl)*(1+.1*act),0,6.283);ctx.stroke()}
 ctx.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
